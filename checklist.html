<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8ec">
    <title>Live checklist — EventLens</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/bauhaus.css">
</head>
<body class="checklist-page">
    <div class="polka-field" aria-hidden="true"></div>
    <nav class="navbar dashboard-nav">
        <a href="/" class="logo" aria-label="EventLens home">
            <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g class="shutter-blade" style="--blade-angle: 0deg; --blade-fill: #7442d8"><path d="M24 3 A21 21 0 0 1 42 13.5 L31 19.8 L24 16 Z"/></g>
                <g class="shutter-blade" style="--blade-angle: 60deg; --blade-fill: #3153e7"><path d="M24 3 A21 21 0 0 1 42 13.5 L31 19.8 L24 16 Z"/></g>
                <g class="shutter-blade" style="--blade-angle: 120deg; --blade-fill: #c21e4b"><path d="M24 3 A21 21 0 0 1 42 13.5 L31 19.8 L24 16 Z"/></g>
                <g class="shutter-blade" style="--blade-angle: 180deg; --blade-fill: #512bba"><path d="M24 3 A21 21 0 0 1 42 13.5 L31 19.8 L24 16 Z"/></g>
                <g class="shutter-blade" style="--blade-angle: 240deg; --blade-fill: #bd2540"><path d="M24 3 A21 21 0 0 1 42 13.5 L31 19.8 L24 16 Z"/></g>
                <g class="shutter-blade" style="--blade-angle: 300deg; --blade-fill: #3445c6"><path d="M24 3 A21 21 0 0 1 42 13.5 L31 19.8 L24 16 Z"/></g>
                <circle class="shutter-center" cx="24" cy="24" r="6"/>
            </svg>
            <span class="logo-divider" aria-hidden="true">│</span><span class="logo-name">Event<span>Lens</span></span>
        </a>
        <div class="dashboard-nav-center">LIVE SHOT CHECKLIST</div>
        <div class="dashboard-nav-right"><a href="dashboard.html">BACK TO ANALYSIS</a></div>
    </nav>
    <main class="info-page checklist-main">
        <p class="eyebrow">ON THE DAY</p>
        <h1 class="info-title">Capture <span class="accent-pink">the plan.</span></h1>
        <p class="info-lede" id="checklistEvent">Your event shot list. Check off moments as your team captures them.</p>
        <section class="checklist-section checklist-standalone" aria-label="Live shot checklist">
            <div class="checklist-header">
                <div><span>SHOT COMPLETION</span><strong id="completionPercent">0%</strong></div>
                <div class="completion-bar"><div id="completionBar"></div></div>
            </div>
            <div class="live-checklist" id="liveChecklist"></div>
        </section>
    </main>
    <script src="js/polka-dots.js" defer></script>
    <script src="js/checklist.js" defer></script>
</body>
</html>
